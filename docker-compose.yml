services:
  backend:
    build:
      context: .
      dockerfile: ./Dict/Dockerfile
      cache_from:
        - dict-backend:latest
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CorsOrigins=https://dict-six-kappa.vercel.app
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-vision-key.json
    volumes:
      - ../gcp-vision-key.json:/app/gcp-vision-key.json:ro
      - trie-cache:/app/cache
    user: root
    restart: unless-stopped

volumes:
  trie-cache: