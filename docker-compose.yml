services:
  backend:
    build:
      context: .
      dockerfile: ./Dict/Dockerfile
      cache_from:
        - dict-backend:latest
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend.env}
        required: false
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      CorsOrigins: ${CORS_ORIGINS:-https://dict-six-kappa.vercel.app}
      FrontendUrl: ${FRONTEND_URL:-https://dict-six-kappa.vercel.app}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-vision-key.json
    volumes:
      - ${GCP_VISION_KEY_PATH:-../gcp-vision-key.json}:/app/gcp-vision-key.json:ro
      - ${APPSETTINGS_PRODUCTION_PATH:-../appsettings.Production.json}:/app/appsettings.Production.json:ro
      - trie-cache:/app/cache
    user: root
    restart: unless-stopped

volumes:
  trie-cache: