name: MiYo CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet packages
        run: dotnet restore Dict.Tests/Dict.Tests.csproj

      - name: 🧪 Run Unit Tests
        run: dotnet test Dict.Tests/Dict.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --no-restore --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~WordControllerTests"

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Dict.Tests/TestResults/*.trx

  deploy:
    needs: test
    runs-on: [self-hosted, azure-vm]

    steps:
      - name: 🔔 Notify Slack - Deployment Started
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": ${{ toJSON(format('🚀 *[MiYo CI/CD]* Deploy bắt đầu trên Azure VM! | Commit: {0} | Bởi: {1}', github.event.head_commit.message, github.actor)) }}
            }

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏗️ Build & Deploy Docker (zero-downtime)
        run: |
          cd ~/Dict
          git fetch --all
          git reset --hard origin/main
          DOCKER_BUILDKIT=1 docker compose build --pull
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: ✅ Health Check
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5008/api/ocr/health || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Backend is up (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i/30 — HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy in time!"
          docker compose logs --tail=50
          exit 1

      - name: 🎉 Notify Slack - Deployment Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "✅ *[MiYo CI/CD] SUCCESS!* Backend MiYo đã deploy thành công lên Azure VM.\nAPI đang hoạt động tại https://dict.australiaeast.cloudapp.azure.com"
            }

      - name: ❌ Notify Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "🚨 *[MiYo CI/CD] FAILED!* Build hoặc Deploy trên Azure VM bị lỗi. Kiểm tra log trên GitHub Actions!"
            }
