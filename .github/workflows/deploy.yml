name: MiYo CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet packages
        run: dotnet restore Dict.Tests/Dict.Tests.csproj

      - name: 🧪 Run Unit Tests
        run: dotnet test Dict.Tests/Dict.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --no-restore --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~WordControllerTests"

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Dict.Tests/TestResults/*.trx

  deploy:
    needs: test
    runs-on: [self-hosted, azure-vm]

    steps:
      - name: 🔔 Notify Slack - Deployment Started
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": ${{ toJSON(format('🚀 *[MiYo CI/CD]* Deploy bắt đầu trên Azure VM! | Commit: {0} | Bởi: {1}', github.event.head_commit.message, github.actor)) }}
            }

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏗️ Build & Deploy Docker (zero-downtime)
        run: |
          # Copy config files (gitignored) vào workspace trước khi build
          cp ~/Dict/backend.env $GITHUB_WORKSPACE/backend.env || true

          # Copy model RAG (gitignored vì quá nặng) vào build context
          # File được tải sẵn 1 lần lên VM tại ~/rag-models/
          cp ~/rag-models/tokenizer.json $GITHUB_WORKSPACE/Dict/tokenizer.json
          cp ~/rag-models/multilingual-e5-small.onnx $GITHUB_WORKSPACE/Dict/multilingual-e5-small.onnx

          cd $GITHUB_WORKSPACE
          # Trỏ GCP key và appsettings Production về path cố định trên VM
          export GCP_VISION_KEY_PATH=~/gcp-vision-key.json
          export APPSETTINGS_PRODUCTION_PATH=~/Dict/Dict/appsettings.Production.json
          DOCKER_BUILDKIT=1 docker compose build
          docker compose up -d --remove-orphans
          # Tag để cache_from dùng được lần sau
          docker tag $(docker compose images -q backend) dict-backend:latest 2>/dev/null || true
          docker image prune -f

      - name: 🔧 Ensure nginx CORS headers
        run: |
          NGINX_CORS_SNIPPET=/etc/nginx/snippets/cors.conf
          sudo tee $NGINX_CORS_SNIPPET > /dev/null <<'CORSEOF'
          set $cors_origin "";
          if ($http_origin ~* "^https://(dict-six-kappa\.vercel\.app|dict-[a-z0-9-]+\.vercel\.app|localhost:[0-9]+)$") {
              set $cors_origin $http_origin;
          }
          add_header 'Access-Control-Allow-Origin' $cors_origin always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
          CORSEOF

          NGINX_SITE=/etc/nginx/sites-available/default
          if ! sudo grep -q "cors.conf" "$NGINX_SITE" 2>/dev/null; then
            echo "Adding cors include to nginx config..."
            sudo sed -i 's|proxy_pass http://localhost|include snippets/cors.conf;\n            proxy_pass http://localhost|' "$NGINX_SITE" || true
          fi
          sudo nginx -t && sudo systemctl reload nginx || echo "Nginx reload skipped"

      - name: ✅ Health Check
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/WeatherForecast 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "404" ]; then
              echo "Backend is up (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i/30 — HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy in time!"
          docker compose logs --tail=50
          exit 1

      - name: 🎉 Notify Slack - Deployment Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "✅ *[MiYo CI/CD] SUCCESS!* Backend MiYo đã deploy thành công lên Azure VM.\nAPI đang hoạt động tại https://dict.australiaeast.cloudapp.azure.com"
            }

      - name: ❌ Notify Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "🚨 *[MiYo CI/CD] FAILED!* Build hoặc Deploy trên Azure VM bị lỗi. Kiểm tra log trên GitHub Actions!"
            }
