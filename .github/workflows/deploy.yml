name: MiYo CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: 🔔 Notify Slack - Deployment Started
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": ${{ toJSON(format('🚀 *[MiYo CI/CD]* Tiến trình tự động Deploy đã bắt đầu trên Raspberry Pi 5! | Commit: {0} | Cập nhật bởi: {1}', github.event.head_commit.message, github.actor)) }}
            }

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏗️ Build Docker Image (no downtime)
        run: |
          cd ~/app/Dict
          git fetch --all
          git reset --hard origin/${{ github.ref_name }}
          DOCKER_BUILDKIT=1 docker compose build
          docker compose up -d
          docker image prune -f

      - name: 🎉 Notify Slack - Deployment Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "✅ *[MiYo CI/CD] SUCCESS!* Hệ thống từ điển MiYo đã được deploy thành công lên Pi 5.\nAPI RAG & Backend .NET Core đã hoạt động ổn định tại cổng 8082!"
            }

      - name: ❌ Notify Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "🚨 *[MiYo CI/CD] FAILED!* Quá trình build Docker hoặc Deploy trên Pi 5 dính lỗi rồi. Kiểm tra ngay log trên GitHub Actions!"
            }
